name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: vpk-11/workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: '3.12'
      compileall: true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
      - run: python scripts/eval_flags.py

  frontend:
    uses: vpk-11/workflows/.github/workflows/node-ci.yml@v1
    with:
      dir: 'client'
      pm: 'pnpm'
      build: 'build'
